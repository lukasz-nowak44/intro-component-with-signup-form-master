<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0"> 

  <link rel="icon" type="image/png" sizes="32x32" href="./images/favicon-32x32.png">
  
  <title>Frontend Mentor | Intro component with sign up form</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">

  <style></style>

</head>

<body>

  <div class="container">

    <header>

      <h1>Learn to code by watching others</h1>
      <p>See how experienced developers solve problems in real-time. Watching scripted tutorials is great, 
      but understanding how developers think is invaluable. </p>

    </header>

    <main>

      <p class="offer"><strong>Try it free 7 days</strong> then $20/mo. thereafter</p>
      
      <section class="card" aria-label="Sign up">

          <form action="/signup" method="post" novalidate>

            <div class="field">
              <label for="first-name" class="visually-hidden">First Name</label>
              <input id="first-name" type="text" name="firstName" placeholder="First Name"
                    autocomplete="given-name" required aria-describedby="first-name-error">
              <p id="first-name-error" class="error" aria-live="polite"></p>
            </div>

            <div class="field">
              <label for="last-name" class="visually-hidden">Last Name</label>
              <input id="last-name" type="text" name="lastName" placeholder="Last Name"
                      autocomplete="family-name" required aria-describedby="last-name-error">
              <p id="last-name-error" class="error" aria-live="polite"></p>
            </div>

            <div class="field">
              <label for="email" class="visually-hidden">First Name</label>
              <input id="email" type="email" name="email" placeholder="Email"
                    autocomplete="email" required aria-describedby="email-error">
              <p id="email-error" class="error" aria-live="polite"></p>
            </div>

            <div class="field">
              <label for="password" class="visually-hidden">First Name</label>
              <input id="password" type="text" name="password" placeholder="Password"
                      autocomplete="new-password" required aria-describedby="password-error">
              <p id="password-error" class="error" aria-live="polite"></p>
            </div>

            <button type="submit" class="btn">CLAIM YOUR FREE TRIAL</button>

          </form>

          <p class="disclaimer">By clicking the button, you are agreeing to our <a href="/terms" class="terms">Terms and Services</a></p>

      </section>

    </main>

  </div>  
  
  <script src="index.js" charset="UTF-8"></script>

</body>
</html>
