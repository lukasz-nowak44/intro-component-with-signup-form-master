<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0"> 

  <link rel="icon" type="image/png" sizes="32x32" href="./images/favicon-32x32.png">
  
  <title>Frontend Mentor | Intro component with sign up form</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">

  <style></style>

</head>

<body>

  <div class="container">

    <header>

      <h1>Learn to code by watching others</h1>
      <p>See how experienced developers solve problems in real-time. Watching scripted tutorials is great, 
      but understanding how developers think is invaluable. </p>

    </header>

    <main>

      <header>

        <div class="offer">
          <p><span>Try it free 7 days </span>then $20/mo. thereafter</p>
        </div>

      </header>

      <article>

          <form action="" method="post" enctype="application/x-www-form-urlencoded">

            <ul class="customer-data">

              <li class="field no0"><input type="text" placeholder="First Name" name="First Name" required /></li>
              <li class="field no1"><input type="text" placeholder="Last Name" name="Last Name" required /></li>
              <li class="field no2"><input type="email" placeholder="Email Address" name="Email" required /></li>
              <li class="field no3"><input type="password" placeholder="Password" name="Password" required /></li>

            </ul>
          
            <button type="submit" class="btn">CLAIM YOUR FREE TRIAL</button>

          </form>

          <footer class="disclaimer">By clicking the button, you are agreeing to our <a href="" class="terms">Terms and Services</a></footer>

      </article>

    </main>

  </div>  
  
  <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
  <script src="index.js" charset="UTF-8"></script>

</body>
</html>
